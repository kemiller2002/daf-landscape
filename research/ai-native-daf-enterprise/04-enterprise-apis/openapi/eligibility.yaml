openapi: 3.1.0
info:
  title: Charity Eligibility API
  version: 1.0.0-draft
  description: |
    Design contract (research artifact, 2026-11-20). Returns dated, sourced, bitemporal eligibility
    facts for recipients and a deterministic policy evaluation pinned to a policy version and to the
    source versions used (IRS Pub 78, EO BMF, auto-revocation list; OFAC lists). Answers are
    reproducible: the same (recipient, as_of, policy_version) returns the same evaluation.
servers:
  - url: https://api.example-daf.org/v1
paths:
  /recipients:
    get:
      operationId: searchRecipients
      summary: Resolve candidate recipients from identifiers or name text (resolution is advisory; donors confirm)
      parameters:
        - { name: ein, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 300 } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        '200':
          description: Candidates with match basis
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        recipient: { $ref: '#/components/schemas/Recipient' }
                        match_basis: { type: string, enum: [exact_ein, alias, fuzzy_name] }
                        score: { type: number, description: 'Only for fuzzy_name; never used to approve' }
      security:
        - oauth2: [eligibility:read]
        - apiKey: []
  /recipients/{recipient_id}/eligibility-facts:
    get:
      operationId: listEligibilityFacts
      parameters:
        - { name: recipient_id, in: path, required: true, schema: { type: string } }
        - { name: as_of, in: query, description: 'Effective-time query; default now', schema: { type: string, format: date-time } }
        - { name: known_at, in: query, description: 'Recorded-time query: what the service knew at this time', schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Bitemporal facts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/EligibilityFact' } }
        '404': { $ref: '#/components/responses/Problem' }
      security:
        - oauth2: [eligibility:read]
        - apiKey: []
  /eligibility/evaluations:
    post:
      operationId: evaluateEligibility
      summary: Evaluate one or more recipients against a tenant policy version (pure, deterministic)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                policy_version: { type: string, description: 'Default: tenant active policy' }
                as_of: { type: string, format: date-time }
                items:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    required: [recipient_id]
                    properties:
                      recipient_id: { type: string }
                      amount: { type: string }
                      grant_type: { type: string, enum: [general, restricted, foreign, fiscal_sponsor, non_charity] }
      responses:
        '200':
          description: Evaluations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Evaluation' } }
        '422': { $ref: '#/components/responses/Problem' }
      security:
        - oauth2: [eligibility:evaluate]
  /eligibility/subscriptions:
    post:
      operationId: subscribeEligibilityChanges
      summary: Subscribe to CharityEligibilityChanged events for a recipient set (continuous monitoring)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [recipient_ids, callback_url]
              properties:
                recipient_ids: { type: array, items: { type: string }, maxItems: 100000 }
                callback_url: { type: string, format: uri }
      responses:
        '201': { description: Subscription created }
      security:
        - oauth2: [eligibility:subscribe]
webhooks:
  charityEligibilityChanged:
    post:
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EligibilityChangedEvent' }
      responses:
        '2XX': { description: Acknowledged }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.example-daf.org/token
          scopes:
            eligibility:read: Read facts
            eligibility:evaluate: Evaluate against policy
            eligibility:subscribe: Subscribe to changes
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Public tier (rate-limited, read-only facts, no evaluations)
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string, format: uri }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
              instance: { type: string }
  schemas:
    Recipient:
      type: object
      properties:
        recipient_id: { type: string }
        ein: { type: [string, 'null'] }
        foreign_id: { type: [string, 'null'] }
        legal_name: { type: string }
        aliases: { type: array, items: { type: string } }
        city: { type: string }
        state: { type: string }
    SourceRef:
      type: object
      required: [source, version, retrieved_at, content_hash]
      properties:
        source: { type: string, enum: [irs_pub78, irs_eo_bmf, irs_auto_revocation, ofac_sdn, ofac_consolidated, equivalency_determination, sponsor_record] }
        version: { type: string, description: 'Publication date or release identifier' }
        retrieved_at: { type: string, format: date-time }
        content_hash: { type: string }
    EligibilityFact:
      type: object
      properties:
        fact_type: { type: string, enum: [pub78_listed, bmf_foundation_code, revoked, reinstated, ofac_listed, type3_supporting_org, private_foundation, equivalency_determined] }
        value: { type: [string, boolean, 'null'] }
        effective_from: { type: [string, 'null'], format: date }
        effective_to: { type: [string, 'null'], format: date }
        recorded_at: { type: string, format: date-time }
        source: { $ref: '#/components/schemas/SourceRef' }
    Evaluation:
      type: object
      properties:
        recipient_id: { type: string }
        result: { type: string, enum: [pass, refer, deny] }
        reasons: { type: array, items: { type: object, properties: { rule_id: { type: string }, message: { type: string } } } }
        policy_version: { type: string }
        as_of: { type: string, format: date-time }
        sources_used: { type: array, items: { $ref: '#/components/schemas/SourceRef' } }
        stale_data: { type: boolean, description: 'If any source exceeded its freshness SLO the result is refer, never pass' }
        decision_id: { type: string }
    EligibilityChangedEvent:
      type: object
      properties:
        event_id: { type: string }
        event_type: { type: string, const: registry.charity_eligibility_changed }
        schema_version: { type: integer }
        recipient_id: { type: string }
        fact: { $ref: '#/components/schemas/EligibilityFact' }
        previous_fact: { $ref: '#/components/schemas/EligibilityFact' }
