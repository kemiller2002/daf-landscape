openapi: 3.1.0
info:
  title: Decisions and Audit Evidence API (read-only)
  version: 1.0.0-draft
  description: |
    Design contract (research artifact, 2026-11-20). Read-only access to immutable decision records
    and control evidence for auditors, regulators (on request), the board and licensed sponsors.
    Auditor scopes are time-boxed and tenant-bound; every read is itself logged.
servers:
  - url: https://api.example-daf.org/v1
paths:
  /decisions/{decision_id}:
    get:
      operationId: getDecision
      parameters:
        - { name: decision_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Decision record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Decision' }
        '404':
          description: Not found or not authorized (indistinguishable)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
      security:
        - oauth2: [evidence:read]
  /decisions:
    get:
      operationId: queryDecisions
      parameters:
        - { name: subject, in: query, schema: { type: string }, description: 'e.g. Grant/G-123' }
        - { name: decision_type, in: query, schema: { type: string, enum: [D, P, H] } }
        - { name: policy_version, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: 'page[after]', in: query, schema: { type: string } }
      responses:
        '200':
          description: Page of decisions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Decision' } }
                  next: { type: [string, 'null'] }
      security:
        - oauth2: [evidence:read]
  /evidence:
    get:
      operationId: queryEvidence
      parameters:
        - { name: control_id, in: query, schema: { type: string } }
        - { name: subject, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Evidence items
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Evidence' } }
      security:
        - oauth2: [evidence:read]
  /evidence/controls/{control_id}/coverage:
    get:
      operationId: getControlCoverage
      summary: Operating-effectiveness summary for a control over a period (counts, exceptions, sampling links)
      parameters:
        - { name: control_id, in: path, required: true, schema: { type: string } }
        - { name: period, in: query, required: true, schema: { type: string, examples: ['2026-Q3'] } }
      responses:
        '200':
          description: Coverage
          content:
            application/json:
              schema:
                type: object
                properties:
                  control_id: { type: string }
                  period: { type: string }
                  population_count: { type: integer }
                  evidence_count: { type: integer }
                  exceptions: { type: integer }
                  missing_evidence_subjects: { type: array, items: { type: string } }
      security:
        - oauth2: [evidence:read]
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.example-daf.org/token
          scopes:
            evidence:read: Read decisions and evidence (time-boxed for auditors)
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    Actor:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, enum: [rule, person, agent, external] }
        id: { type: string }
        authority_ref: { type: [string, 'null'], description: 'Delegation register entry for persons' }
        act_chain: { type: array, items: { type: string } }
    Decision:
      type: object
      required: [decision_id, subject, decision_type, outcome, actor, recorded_at, inputs_hash]
      properties:
        decision_id: { type: string }
        subject: { type: string }
        decision_type: { type: string, enum: [D, P, H] }
        outcome: { type: string, enum: [pass, flag, refer, deny, approve, decline, clear_flag] }
        actor: { $ref: '#/components/schemas/Actor' }
        policy_ref: { type: [string, 'null'], description: 'policy_id@version and rule ids' }
        inputs_hash: { type: string }
        source_versions: { type: array, items: { type: string } }
        flags_raised: { type: array, items: { type: string } }
        flags_cleared:
          type: array
          description: 'Invariant: only populated when actor.kind is rule or person'
          items: { type: string }
        evidence_viewed: { type: array, items: { type: string }, description: 'For H decisions: what the human saw' }
        rationale: { type: [string, 'null'] }
        recorded_at: { type: string, format: date-time }
        effective_at: { type: string, format: date-time }
    Evidence:
      type: object
      properties:
        evidence_id: { type: string }
        control_id: { type: string }
        subject: { type: string }
        produced_by: { type: string }
        content_hash: { type: string }
        recorded_at: { type: string, format: date-time }
        decision_ids: { type: array, items: { type: string } }
