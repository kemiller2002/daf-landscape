openapi: 3.1.0
info:
  title: Delegated Privileges API (including AI agent principals)
  version: 1.0.0-draft
  description: |
    Design contract (research artifact, 2026-11-20). Account holders grant scoped, revocable,
    capped privileges to advisors, family members, successors and AI agent principals (DD-017).
    Agents never receive credentials; they obtain agent-principal tokens by RFC 8693 token
    exchange that reference an active grant. Agent principals can never call this API
    (no privileges:manage scope), so an agent cannot widen its own authority.
servers:
  - url: https://api.example-daf.org/v1
paths:
  /privileges:
    post:
      operationId: grantPrivilege
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrivilegeGrantCreate' }
      responses:
        '201':
          description: Granted (PrivilegeGranted event); requires step-up authentication of the grantor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivilegeGrant' }
        '403':
          description: Not the account holder, or step-up not satisfied
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Scope or caps exceed program policy, or grantee unverified
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
      security:
        - oauth2: [privileges:manage]
    get:
      operationId: listPrivileges
      parameters:
        - { name: account_id, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Active and historical grants
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PrivilegeGrant' } }
      security:
        - oauth2: [privileges:read]
  /privileges/{grant_id}:
    delete:
      operationId: revokePrivilege
      summary: Revoke immediately; outstanding agent tokens are invalidated (PrivilegeRevoked)
      parameters:
        - { name: grant_id, in: path, required: true, schema: { type: string } }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivilegeGrant' }
      security:
        - oauth2: [privileges:manage]
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example-daf.org/authorize
          tokenUrl: https://auth.example-daf.org/token
          scopes:
            privileges:manage: Grant and revoke (account holders only; never issued to agent principals)
            privileges:read: Read grants
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    PrivilegeGrantCreate:
      type: object
      required: [account_id, grantee, scope]
      properties:
        account_id: { type: string }
        grantee:
          type: object
          required: [kind, id]
          properties:
            kind: { type: string, enum: [person, institution, agent_client] }
            id: { type: string, description: 'Party id, institution client id, or registered agent client id' }
        scope:
          type: array
          items: { type: string, enum: [view, recommend_grants, recommend_investments, contribute, receive_statements, act_as_successor] }
        caps:
          type: object
          description: Required when grantee.kind = agent_client
          properties:
            max_amount_per_grant: { type: string }
            max_amount_per_day: { type: string }
            recipient_allowlist: { type: array, items: { type: string } }
            confirm_above: { type: string, description: 'Agent-originated recommendations above this amount wait for donor confirmation on a separate channel' }
        expires_at: { type: string, format: date-time }
    PrivilegeGrant:
      allOf:
        - $ref: '#/components/schemas/PrivilegeGrantCreate'
        - type: object
          properties:
            grant_id: { type: string }
            status: { type: string, enum: [active, revoked, expired] }
            consent_event_id: { type: string }
            granted_at: { type: string, format: date-time }
            revoked_at: { type: [string, 'null'], format: date-time }
            etag: { type: string }
