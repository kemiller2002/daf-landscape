openapi: 3.1.0
info:
  title: Grant Payments API (INTERNAL ONLY)
  version: 1.0.0-draft
  description: |
    Design contract (research artifact, 2026-11-20). INTERNAL module contract of capability C3.4.
    Never exposed to donors, advisors, partners or agent principals. The only caller of
    createPaymentInstruction is the payment gate workflow after a GrantApproved event. Rails and banks
    reach the enterprise only through the inbound settlement endpoint (mTLS service identity).
    Gate checks: grant state = approved; payment profile verified and not in cooling-off; per-account,
    per-recipient and enterprise fan-out limits; dual control above threshold; sufficient available
    balance; no open blocking flag. Idempotency key is passed through to the rail.
servers:
  - url: internal://payments/v1
x-exposure: internal
paths:
  /payments:
    post:
      operationId: createPaymentInstruction
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
          description: 'Deterministic: hash(grant_id, attempt_no). Forwarded to the rail.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_ids, gate_decision_id]
              properties:
                grant_ids: { type: array, items: { type: string }, minItems: 1 }
                gate_decision_id: { type: string, description: 'Payment gate decision record; instruction rejected without it' }
                rail: { type: string, enum: [ach_ccd_plus, rtp, fednow, wire, partner_rail, check] }
                dual_control_approval_id: { type: [string, 'null'] }
      responses:
        '201':
          description: Instruction created (PaymentInstructed event)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentInstruction' }
        '409':
          description: Duplicate or gate failure
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
      security:
        - moduleIdentity: [payments:instruct]
  /payments/{payment_id}:
    get:
      operationId: getPayment
      parameters:
        - { name: payment_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentInstruction' }
      security:
        - moduleIdentity: [payments:read]
  /settlements:
    post:
      operationId: receiveSettlement
      summary: Inbound settlement, return or status from a rail/bank (mTLS + signed payload)
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettlementNotice' }
      responses:
        '202': { description: Accepted; matched by rail idempotency key → PaymentSettled / PaymentReturned }
      security:
        - railMtls: []
components:
  securitySchemes:
    moduleIdentity:
      type: oauth2
      description: In-process module identity; scopes granted only to the payment-gate workflow.
      flows:
        clientCredentials:
          tokenUrl: internal://auth/token
          scopes:
            payments:instruct: Create payment instructions (payment gate only)
            payments:read: Read payments
    railMtls:
      type: mutualTLS
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        failed_checks: { type: array, items: { type: string } }
    PaymentInstruction:
      type: object
      properties:
        payment_id: { type: string }
        grant_ids: { type: array, items: { type: string } }
        amount: { type: string }
        rail: { type: string }
        payee_profile_id: { type: string }
        rail_idempotency_key: { type: string }
        state: { type: string, enum: [instructed, sent, settled, returned, failed, voided] }
        remittance:
          type: object
          description: Machine-readable remittance carrying grant IDs (DD-018); donor info per recognition choice
          properties:
            grant_ids: { type: array, items: { type: string } }
            donor_display: { type: [string, 'null'] }
            purpose: { type: [string, 'null'] }
    SettlementNotice:
      type: object
      required: [rail_idempotency_key, status, rail_reference, occurred_at]
      properties:
        rail_idempotency_key: { type: string }
        status: { type: string, enum: [settled, returned, rejected] }
        return_code: { type: [string, 'null'] }
        rail_reference: { type: string }
        occurred_at: { type: string, format: date-time }
        signature: { type: string }
