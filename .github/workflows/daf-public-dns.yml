name: DAF public DNS and CT inventory
on:
  workflow_dispatch:
    inputs:
      include_ct:
        description: "Include certificate transparency collection"
        type: boolean
        default: true
  schedule:
    - cron: "17 10 * * 1"
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect public DNS and CT evidence
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.include_ct }}" = "true" ]; then
            python scripts/collect_daf_dns.py --out output/dns --ct
          else
            python scripts/collect_daf_dns.py --out output/dns
          fi
      - name: Upload raw observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daf-public-dns-${{ github.run_id }}
          path: output/dns/
          if-no-files-found: warn
          retention-days: 90
